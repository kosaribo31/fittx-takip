<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fittx Takip">
<meta name="theme-color" content="#0B0F14">
<title>Fittx Takip</title>
<style>
  :root {
    --bg: #0B0F14;
    --card: #141B23;
    --card2: #1B2430;
    --border: #263242;
    --green: #22C55E;
    --green-soft: rgba(34, 197, 94, 0.14);
    --blue: #38BDF8;
    --blue-soft: rgba(56, 189, 248, 0.14);
    --text: #F1F5F9;
    --muted: #94A3B8;
    --warn: #F59E0B;
    --danger: #EF4444;
    --red-yt: #E11D48;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior-y: none;
  }
  body {
    padding-bottom: calc(92px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(11, 15, 20, 0.96);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: calc(12px + env(safe-area-inset-top)) 14px 10px;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .brand {
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.4px;
  }
  .brand span { color: var(--green); }
  .timer-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 7px 10px;
  }
  .timer-display {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 16px;
    color: var(--green);
    min-width: 52px;
  }
  .timer-btn {
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 9px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .timer-btn.stop { margin-left: auto; color: var(--muted); }

  main { padding: 14px; max-width: 680px; margin: 0 auto; }

  .install-banner {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.14), rgba(56, 189, 248, 0.12));
    border: 1px solid rgba(34, 197, 94, 0.35);
    border-radius: 13px;
    padding: 11px 12px;
    margin-bottom: 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    font-size: 12.5px;
    line-height: 1.45;
  }
  .install-banner strong { color: var(--green); display: block; margin-bottom: 2px; font-size: 13px; }
  .install-close {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 16px;
    font-weight: 700;
    padding: 2px 6px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 12px;
  }
  .day-title { font-size: 20px; font-weight: 800; margin: 0; }
  .day-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .ex-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px;
    margin-bottom: 12px;
  }
  .ex-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .ex-name { font-size: 16px; font-weight: 700; margin: 0; }
  .ex-muscle { font-size: 12px; color: var(--green); margin-top: 2px; font-weight: 600; }
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--card2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .badge.pr { color: var(--warn); border-color: rgba(245, 158, 11, 0.35); }
  .badge.last { color: #93C5FD; border-color: rgba(147, 197, 253, 0.3); }

  .guide-toggle {
    margin-top: 10px;
    width: 100%;
    text-align: left;
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .guide-box {
    display: none;
    margin-top: 8px;
    background: #0F151C;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px;
    font-size: 13px;
    line-height: 1.5;
  }
  .guide-box.open { display: block; }
  .guide-item { margin-bottom: 8px; }
  .guide-item strong { color: var(--green); }
  .video-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .btn-yt {
    flex: 1;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    background: var(--red-yt);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 9px;
    border: none;
    cursor: pointer;
  }
  .btn-link-edit {
    background: var(--card2);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .sets-wrap { margin-top: 11px; }
  .set-head {
    display: grid;
    grid-template-columns: 44px 1fr 1fr 44px;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
    padding: 0 2px;
  }
  .set-row {
    display: grid;
    grid-template-columns: 44px 1fr 1fr 44px;
    gap: 8px;
    align-items: center;
    margin-bottom: 7px;
  }
  .set-num {
    background: var(--card2);
    border-radius: 8px;
    text-align: center;
    padding: 10px 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }
  .set-input {
    width: 100%;
    background: #0D131A;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 16px;
    font-weight: 600;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .set-input:focus { border-color: var(--green); }
  .check-btn {
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--muted);
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
  }
  .check-btn.done {
    background: var(--green);
    border-color: var(--green);
    color: #052E16;
  }
  .set-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .mini-btn {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .note-input {
    width: 100%;
    margin-top: 8px;
    background: #0D131A;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 16px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .note-input:focus { border-color: var(--green); }

  .save-workout-btn {
    width: 100%;
    background: var(--green);
    color: #052E16;
    border: none;
    border-radius: 13px;
    padding: 15px;
    font-size: 16px;
    font-weight: 800;
    margin-top: 6px;
    cursor: pointer;
  }

  /* Su Sekmesi */
  .water-big {
    text-align: center;
    padding: 14px 10px 8px;
  }
  .water-ml {
    font-size: 34px;
    font-weight: 900;
    color: var(--blue);
  }
  .water-goal {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }
  .progress-track {
    width: 100%;
    height: 14px;
    background: #0D131A;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin: 14px 0 10px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #0284C7, #38BDF8);
    transition: width 0.25s ease;
  }
  .water-btn-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .water-add-btn {
    background: var(--blue-soft);
    color: var(--blue);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 10px;
    padding: 11px 6px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }
  .water-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .water-row:last-child { border-bottom: none; }
  .water-select {
    background: #0D131A;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 16px;
    font-weight: 600;
  }
  .toggle-pill {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--muted);
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
  }
  .toggle-pill.on {
    background: var(--blue);
    border-color: var(--blue);
    color: #082F49;
  }
  .water-save-btn {
    width: 100%;
    background: var(--blue);
    color: #082F49;
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-size: 15px;
    font-weight: 800;
    margin-top: 10px;
    cursor: pointer;
  }
  .info-note {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.45;
    margin-top: 8px;
  }

  .history-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .history-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 8px;
  }
  .history-line {
    font-size: 13px;
    margin-bottom: 5px;
    color: var(--text);
  }
  .history-line span { color: var(--muted); }
  .del-btn {
    background: rgba(239, 68, 68, 0.14);
    color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.35);
    border-radius: 7px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .backup-box {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .backup-btn {
    flex: 1;
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(11, 15, 20, 0.98);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    padding: 6px 4px calc(10px + env(safe-area-inset-bottom));
    z-index: 60;
  }
  .nav-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 6px 2px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .nav-btn .ico { font-size: 18px; }
  .nav-btn.active {
    color: var(--green);
    background: var(--green-soft);
  }
  .nav-btn.active.water-nav {
    color: var(--blue);
    background: var(--blue-soft);
  }
  .toast {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    background: var(--green);
    color: #052E16;
    font-weight: 800;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 999px;
    z-index: 100;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    white-space: nowrap;
  }
</style>
</head>

<header>
  <div class="top-row">
    <div class="brand">FITTX <span>TAKİP</span></div>
    <div style="font-size:12px;color:var(--muted);" id="todayDate"></div>
  </div>
  <div class="timer-bar">
    <div class="timer-display" id="timerDisplay">00:00</div>
    <button class="timer-btn" onclick="startTimer(60)">60 sn</button>
    <button class="timer-btn" onclick="startTimer(90)">90 sn</button>
    <button class="timer-btn" onclick="startTimer(120)">120 sn</button>
    <button class="timer-btn stop" onclick="stopTimer()">Sıfırla</button>
  </div>
</header>

<main id="app"></main>

<nav>
  <button class="nav-btn active" id="nav-0" onclick="switchTab(0)">
    <span class="ico">💪</span><span>1. Gün</span>
  </button>
  <button class="nav-btn" id="nav-1" onclick="switchTab(1)">
    <span class="ico">🏋️</span><span>2. Gün</span>
  </button>
  <button class="nav-btn" id="nav-2" onclick="switchTab(2)">
    <span class="ico">🦵</span><span>3. Gün</span>
  </button>
  <button class="nav-btn water-nav" id="nav-3" onclick="switchTab(3)">
    <span class="ico">💧</span><span>Su</span>
  </button>
  <button class="nav-btn" id="nav-4" onclick="switchTab(4)">
    <span class="ico">📊</span><span>Geçmiş</span>
  </button>
</nav>

/* Tek dosyada iOS/Android uygulama ikonu ve PWA manifest üretimi */
(function initPwaAssets() {
  try {
    const c = document.createElement("canvas");
    c.width = 180;
    c.height = 180;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#0B0F14";
    ctx.fillRect(0, 0, 180, 180);

    ctx.strokeStyle = "#22C55E";
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.roundRect(14, 14, 152, 152, 34);
    ctx.stroke();

    ctx.fillStyle = "#22C55E";
    ctx.font = "900 72px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("FX", 90, 82);

    ctx.fillStyle = "#F1F5F9";
    ctx.font = "700 22px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText("FITTX", 90, 134);

    const pngUrl = c.toDataURL("image/png");

    const appleIcon = document.createElement("link");
    appleIcon.rel = "apple-touch-icon";
    appleIcon.sizes = "180x180";
    appleIcon.href = pngUrl;
    document.head.appendChild(appleIcon);

    const favIcon = document.createElement("link");
    favIcon.rel = "icon";
    favIcon.type = "image/png";
    favIcon.href = pngUrl;
    document.head.appendChild(favIcon);

    const manifestObj = {
      name: "Fittx Antrenman Takip",
      short_name: "Fittx Takip",
      start_url: ".",
      display: "standalone",
      background_color: "#0B0F14",
      theme_color: "#0B0F14",
      icons: [{ src: pngUrl, sizes: "180x180", type: "image/png" }]
    };
    const manifestLink = document.createElement("link");
    manifestLink.rel = "manifest";
    manifestLink.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifestObj));
    document.head.appendChild(manifestLink);
  } catch (e) {}
})();

function safeGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function safeSet(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) {}
}

let timerInterval = null;
let timerEndTs = 0;

document.getElementById("todayDate").textContent = new Date().toLocaleDateString("tr-TR", {
  day: "numeric", month: "short", weekday: "short"
});

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function formatSetText(s, isBodyweight) {
  const noWeight = !s.kg || s.kg === "0" || parseFloat(s.kg) === 0;
  if (isBodyweight && noWeight) {
    return `${s.reps} tkr`;
  }
  return `${s.kg}kg×${s.reps}`;
}

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = "none"; }, 2200);
}

function beep() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.value = 0.2;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    setTimeout(() => { osc.stop(); ctx.close(); }, 350);
  } catch (e) {}
}

function updateTimerUI(sec) {
  const safeSec = Math.max(0, sec);
  const m = String(Math.floor(safeSec / 60)).padStart(2, "0");
  const s = String(safeSec % 60).padStart(2, "0");
  document.getElementById("timerDisplay").textContent = `${m}:${s}`;
}

function tickTimer() {
  if (!timerEndTs) return;
  const left = Math.ceil((timerEndTs - Date.now()) / 1000);
  if (left <= 0) {
    clearInterval(timerInterval);
    timerInterval = null;
    timerEndTs = 0;
    updateTimerUI(0);
    beep();
    showToast("Dinlenme bitti, sıradaki sete gir!");
  } else {
    updateTimerUI(left);
  }
}

function startTimer(sec) {
  clearInterval(timerInterval);
  timerEndTs = Date.now() + sec * 1000;
  updateTimerUI(sec);
  timerInterval = setInterval(tickTimer, 500);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerEndTs = 0;
  updateTimerUI(0);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && timerEndTs) tickTimer();
});

function getDraft(ex) {
  if (!draftData[ex.id]) {
    draftData[ex.id] = {
      sets: Array.from({ length: ex.defaultSets }, () => ({ kg: "", reps: "", done: false })),
      note: ""
    };
  }
  return draftData[ex.id];
}

function saveDraft() {
  safeSet(LS_DRAFT, draftData);
}

function getStats(exId) {
  let last = null;
  let pr = 0;
  for (let i = 0; i < historyData.length; i++) {
    const entry = historyData[i];
    const found = entry.items.find(x => x.id === exId);
    if (found) {
      if (!last) last = found;
      found.sets.forEach(s => {
        const k = parseFloat(s.kg) || 0;
        if (k > pr) pr = k;
      });
    }
  }
  return { last, pr };
}

function getVideoUrl(ex) {
  if (customLinks[ex.id]) {
    const u = customLinks[ex.id];
    return /^https?:\/\//i.test(u) ? u : "https://" + u;
  }
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent(ex.query);
}

function editCustomLink(exId, exName) {
  const current = customLinks[exId] || "";
  const val = prompt(`${exName} için özel YouTube linki yapıştır (varsayılana dönmek için boş bırak):`, current);
  if (val === null) return;
  const trimmed = val.trim();
  if (trimmed === "") {
    delete customLinks[exId];
    showToast("Varsayılan YouTube aramasına dönüldü");
  } else {
    customLinks[exId] = trimmed;
    showToast("Özel video linki kaydedildi");
  }
  safeSet(LS_LINKS, customLinks);
  render();
}

function updateSet(exId, idx, field, val) {
  draftData[exId].sets[idx][field] = val;
  saveDraft();
}

function toggleSetDone(exId, idx) {
  const s = draftData[exId].sets[idx];
  s.done = !s.done;
  saveDraft();
  if (s.done) startTimer(90);
  render();
}

function addSet(exId) {
  draftData[exId].sets.push({ kg: "", reps: "", done: false });
  saveDraft();
  render();
}

function removeSet(exId) {
  if (draftData[exId].sets.length > 1) {
    draftData[exId].sets.pop();
    saveDraft();
    render();
  }
}

function updateNote(exId, val) {
  draftData[exId].note = val;
  saveDraft();
}

function toggleGuide(exId) {
  const box = document.getElementById("guide-" + exId);
  if (!box) return;
  if (openGuides.has(exId)) {
    openGuides.delete(exId);
    box.classList.remove("open");
  } else {
    openGuides.add(exId);
    box.classList.add("open");
  }
}

function saveWorkout(dayIndex) {
  const day = PROGRAM[dayIndex];
  const items = [];
  day.exercises.forEach(ex => {
    const d = getDraft(ex);
    const validSets = d.sets.filter(s => (s.kg !== "" && s.kg !== null) || (s.reps !== "" && s.reps !== null));
    if (validSets.length > 0) {
      items.push({
        id: ex.id,
        name: ex.name,
        bodyweight: !!ex.bodyweight,
        note: d.note || "",
        sets: validSets.map(s => ({ kg: s.kg || "0", reps: s.reps || "0" }))
      });
    }
  });

  if (items.length === 0) {
    showToast("Önce en az bir hareketin kilo veya tekrarını gir!");
    return;
  }

  historyData.unshift({
    ts: Date.now(),
    dateStr: new Date().toLocaleDateString("tr-TR", {
      day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit"
    }),
    dayId: day.id,
    dayTitle: day.title,
    items
  });
  safeSet(LS_HISTORY, historyData);

  day.exercises.forEach(ex => {
    draftData[ex.id].sets.forEach(s => { s.done = false; });
  });
  saveDraft();
  showToast("Antrenman kaydedildi! Eline sağlık 💪");
  render();
}

function deleteHistory(ts) {
  if (!confirm("Bu antrenman kaydını silmek istiyor musun?")) return;
  historyData = historyData.filter(x => x.ts !== ts);
  safeSet(LS_HISTORY, historyData);
  render();
}

function exportBackup() {
  const payload = JSON.stringify({ historyData, customLinks, waterCfg });
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(payload)
      .then(() => showToast("Yedek panoya kopyalandı!"))
      .catch(() => prompt("Aşağıdaki yedek metnini kopyala:", payload));
  } else {
    prompt("Aşağıdaki yedek metnini kopyala:", payload);
  }
}

function importBackup() {
  const raw = prompt("Daha önce kopyaladığın yedek metnini buraya yapıştır:");
  if (!raw) return;
  try {
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed.historyData)) {
      historyData = parsed.historyData;
      safeSet(LS_HISTORY, historyData);
    }
    if (parsed.customLinks) {
      customLinks = parsed.customLinks;
      safeSet(LS_LINKS, customLinks);
    }
    if (parsed.waterCfg) {
      waterCfg = Object.assign(waterCfg, parsed.waterCfg);
      safeSet(LS_WATER_CFG, waterCfg);
    }
    showToast("Yedek başarıyla geri yüklendi!");
    render();
  } catch (e) {
    showToast("Geçersiz yedek formatı!");
  }
}

          <div class="guide-item"><strong>Nefes:</strong> ${ex.breath}</div>
          <div class="video-row">
            <a class="btn-yt" href="${escapeHtml(getVideoUrl(ex))}" target="_blank" rel="noopener noreferrer">▶ YouTube'da İzle</a>
            <button class="btn-link-edit" onclick="editCustomLink('${ex.id}', '${ex.name}')">
              ${customLinks[ex.id] ? "🔗 Linki Değiştir" : "+ Özel Link"}
            </button>
          </div>
        </div>

        <div class="sets-wrap">
          <div class="set-head">
            <div>Set</div>
            <div>${ex.bodyweight ? "Ek Kilo (kg)" : "Kilo (kg)"}</div>
            <div>Tekrar</div>
            <div style="text-align:center;">Bitti</div>
          </div>
          ${d.sets.map((s, idx) => {
            const prevSet = stats.last && stats.last.sets[idx] ? stats.last.sets[idx] : null;
            const kgPh = prevSet ? prevSet.kg : (ex.bodyweight ? "0" : "kg");
            const repPh = prevSet ? prevSet.reps : "10";
            return `
              <div class="set-row">
                <div class="set-num">${idx + 1}</div>
                <input class="set-input" type="number" inputmode="decimal" step="0.5" placeholder="${escapeHtml(kgPh)}" value="${escapeHtml(s.kg)}" oninput="updateSet('${ex.id}', ${idx}, 'kg', this.value)">
                <input class="set-input" type="number" inputmode="numeric" placeholder="${escapeHtml(repPh)}" value="${escapeHtml(s.reps)}" oninput="updateSet('${ex.id}', ${idx}, 'reps', this.value)">
                <button class="check-btn ${s.done ? "done" : ""}" onclick="toggleSetDone('${ex.id}', ${idx})">✓</button>
              </div>
            `;
          }).join("")}
          <div class="set-actions">
            <button class="mini-btn" onclick="addSet('${ex.id}')">+ Set Ekle</button>
            <button class="mini-btn" onclick="removeSet('${ex.id}')">- Set Sil</button>
          </div>
          <input class="note-input" type="text" placeholder="Not (örn: Koltuk ayarı 4, tutuş dar...)" value="${escapeHtml(d.note)}" oninput="updateNote('${ex.id}', this.value)">
        </div>
      </div>
    `;
  });

  html += `<button class="save-workout-btn" onclick="saveWorkout(${currentTab})">✅ Antrenmanı Kaydet</button>`;
  app.innerHTML = html;
}

function renderWater(app) {
  const todayMl = waterLog[getTodayKey()] || 0;
  const pct = Math.min(100, Math.round((todayMl / waterCfg.goalMl) * 100));

  const hourOptions = (selected) => {
    let out = "";
    for (let h = 0; h <= 23; h++) {
      const label = String(h).padStart(2, "0") + ":00";
      out += `<option value="${h}" ${h === selected ? "selected" : ""}>${label}</option>`;
    }
    return out;
  };

  let reminderCardHtml = "";
  if (isAndroidApk) {
    reminderCardHtml = `
      <div class="ex-card">
        <div class="water-row">
          <div>
            <strong>Sessiz Bildirim</strong>
            <div style="font-size:11px;color:var(--muted);">Üst pencereden sessiz düşer</div>
          </div>
          <button class="toggle-pill ${waterCfg.enabled ? "on" : ""}" onclick="toggleWaterReminder()">
            ${waterCfg.enabled ? "AÇIK" : "KAPALI"}
          </button>
        </div>

        <div class="water-row">
          <span>Hatırlatma Sıklığı</span>
          <select class="water-select" onchange="updateWaterField('intervalMin', this.value)">
            ${[30, 45, 60, 90, 120].map(m => `<option value="${m}" ${waterCfg.intervalMin === m ? "selected" : ""}>Her ${m} dk</option>`).join("")}
          </select>
        </div>

        <div class="water-row">
          <span>Aktif Başlangıç Saati</span>
          <select class="water-select" onchange="updateWaterField('startHour', this.value)">
            ${hourOptions(waterCfg.startHour)}
          </select>
        </div>

        <div class="water-row">
          <span>Aktif Bitiş Saati</span>
          <select class="water-select" onchange="updateWaterField('endHour', this.value)">
            ${hourOptions(waterCfg.endHour)}
          </select>
        </div>

        <button class="water-save-btn" onclick="applyWaterConfig(false)">💾 Hatırlatıcıyı Kaydet</button>

        <div class="backup-box" style="margin-top:10px;margin-bottom:0;">
          <button class="backup-btn" onclick="testWaterNotification()">🔔 Test Bildirimi</button>
          <button class="backup-btn" onclick="openWaterChannelSettings()">⚙️ Kanal Ayarı</button>
        </div>
      </div>
    `;
  } else {
    reminderCardHtml = `
      <div class="ex-card">
        <div class="water-row" style="border-bottom:none;padding:4px 0;">
          <span>Günlük Su Hedefi</span>
          <select class="water-select" onchange="updateWaterField('goalMl', this.value); render();">
            ${[2000, 2500, 3000, 3500, 4000].map(g => `<option value="${g}" ${waterCfg.goalMl === g ? "selected" : ""}>${(g / 1000).toFixed(1)} Litre</option>`).join("")}
          </select>
        </div>
        <div class="info-note">
          İçtiğin suyu gün boyu buradan tek dokunuşla kaydedebilirsin; gece yarısı otomatik sıfırlanır. Arka planda sessiz hatırlatma bildirimi Android APK sürümünde aktiftir.
        </div>
      </div>
    `;
  }

  app.innerHTML = getInstallBannerHtml() + `
    <div class="day-header">
      <div>
        <h1 class="day-title">Günlük Su Takibi</h1>
        <div class="day-sub">Günlük hedefine göre su tüketimini takip et</div>
      </div>
    </div>

    <div class="ex-card">
      <div class="water-big">
        <div class="water-ml">${(todayMl / 1000).toFixed(2)} L</div>
        <div class="water-goal">${todayMl} ml / Hedef: ${waterCfg.goalMl} ml (%${pct})</div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>
      </div>
      <div class="water-btn-grid">
        <button class="water-add-btn" onclick="addWater(200)">+200 ml<br><span style="font-size:11px;font-weight:500;">Bardak</span></button>
        <button class="water-add-btn" onclick="addWater(300)">+300 ml<br><span style="font-size:11px;font-weight:500;">Büyük</span></button>
        <button class="water-add-btn" onclick="addWater(500)">+500 ml<br><span style="font-size:11px;font-weight:500;">Şişe</span></button>
      </div>
      <div class="set-actions" style="margin-top:10px;">
        <button class="mini-btn" onclick="addWater(-200)">-200 ml Geri Al</button>
        <button class="mini-btn" onclick="addWater(-99999)">Bugünü Sıfırla</button>
      </div>
      ${isAndroidApk ? `
        <div class="water-row" style="margin-top:10px;border-top:1px solid var(--border);border-bottom:none;padding-bottom:0;">
          <span>Günlük Hedef</span>
          <select class="water-select" onchange="updateWaterField('goalMl', this.value); render();">
            ${[2000, 2500, 3000, 3500, 4000].map(g => `<option value="${g}" ${waterCfg.goalMl === g ? "selected" : ""}>${(g / 1000).toFixed(1)} Litre</option>`).join("")}
          </select>
        </div>
      ` : ""}
    </div>

    ${reminderCardHtml}
  `;
}

function renderHistory(app) {
  let html = getInstallBannerHtml() + `
    <div class="day-header">
      <div>
        <h1 class="day-title">Antrenman Geçmişi</h1>
        <div class="day-sub">Toplam ${historyData.length} kayıtlı antrenman</div>
      </div>
    </div>
    <div class="backup-box">
      <button class="backup-btn" onclick="exportBackup()">📋 Yedeği Kopyala</button>
      <button class="backup-btn" onclick="importBackup()">📥 Yedek Yükle</button>
    </div>
  `;

  if (historyData.length === 0) {
    html += `<div class="history-card" style="color:var(--muted);text-align:center;padding:24px;">Henüz kayıtlı antrenman yok. Bir günü bitirip "Antrenmanı Kaydet" dediğinde burada listelenecek.</div>`;
  } else {
    historyData.forEach(entry => {
      html += `
        <div class="history-card">
          <div class="history-top">
            <div>
              <div style="font-weight:800;font-size:15px;">${escapeHtml(entry.dayTitle)}</div>
              <div style="font-size:11px;color:var(--muted);">${escapeHtml(entry.dateStr)}</div>
            </div>
            <button class="del-btn" onclick="deleteHistory(${entry.ts})">Sil</button>
          </div>
          ${entry.items.map(it => {
            const isBw = it.bodyweight || BODYWEIGHT_IDS.has(it.id);
            return `
              <div class="history-line">
                <strong>${escapeHtml(it.name)}:</strong>
                <span>${it.sets.map(s => escapeHtml(formatSetText(s, isBw))).join(" · ")}</span>
                ${it.note ? `<div style="font-size:11px;color:#93C5FD;">Not: ${escapeHtml(it.note)}</div>` : ""}
              </div>
            `;
          }).join("")}
        </div>
      `;
    });
  }
  app.innerHTML = html;
}

render();
</script>
</body>
</html>
